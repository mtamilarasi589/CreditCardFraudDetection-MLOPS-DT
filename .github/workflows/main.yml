name: Decision Tree MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ Setup Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3️⃣ Install dependencies + gdown
    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install gdown

    # 4️⃣ Download dataset from Google Drive
    - name: Download Dataset from Google Drive
      run: |
        echo "Downloading fraud.csv from Google Drive..."
        gdown --id 1ghmZ_zYH5yGauV1iVQFdqSHErGCNrjzA -O fraud.csv
        ls -la

    # 5️⃣ Retrain model
    - name: Retrain Decision Tree
      run: |
        echo "Starting model retraining..."
        python train.py
        echo "Retraining completed."

    # 6️⃣ Commit updated model
    - name: Commit Updated Model
      run: |
        git config --global user.name "Tamilarasi"
        git config --global user.email "mtamilarasi589@gmail.com"
        git add model.pkl retrain_log.txt
        git diff --cached --quiet || git commit -m "Auto retrained Decision Tree model"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 7️⃣ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t decisiontree-mlops-app .